# Render 一键部署（Blueprint）：在 Render 里 New → Blueprint，选中本仓库即可
# 免费实例重启后数据会回到初始演示状态；要长期保存请升级实例并把磁盘挂到 /app/backend/data
services:
  - type: web
    name: studyflow-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SEED_DEMO
        value: "true"
      # 每次部署自动生成随机 JWT 密钥
      - key: SECRET_KEY
        generateValue: true
      # 需要 AI 能力时在控制台填入（留空则用内置题库 + 规则讲解）
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
